<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartResume - Resume Preview</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='pro.css') }}">

    <style>

        body {
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .preview-container {
            max-width: 850px;
            margin: 40px auto;
        }

        .resume-paper {
            background: white;
            padding: 45px 55px;
            min-height: 1100px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .resume-header {
            text-align: center;
            border-bottom: 2px solid #222;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        #previewName {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #previewContact,
        #previewSocial {
            font-size: 14px;
            margin-top: 5px;
            color: #444;
        }

        .resume-section {
            margin-top: 22px;
        }

        .resume-section h2 {
            font-size: 17px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .resume-section p {
            font-size: 14px;
            line-height: 1.6;
        }

        .education-line,
        .skill-line,
        .internship-line {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 4px;
        }

        .education-main {
            font-weight: bold;
        }

        .skill-category {
            font-weight: bold;
        }

        .project-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .project-list,
        .resume-section ul {
            padding-left: 22px;
            margin-bottom: 0;
        }

        .project-list li,
        .resume-section li {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 4px;
        }

        .top-buttons {
            text-align: center;
            margin-bottom: 25px;
        }

        .top-buttons a,
        .top-buttons button {
            margin: 5px;
        }

        @media print {

            body {
                background: white;
            }

            .top-buttons {
                display: none;
            }

            .preview-container {
                margin: 0;
                max-width: none;
            }

            .resume-paper {
                box-shadow: none;
                padding: 30px 40px;
            }

        }

    </style>

</head>


<body>


<div class="preview-container">


    <!-- BUTTONS -->

    <div class="top-buttons">

        <a href="/home"
           class="btn btn-secondary">
            Dashboard
        </a>

        <a href="/resume"
           class="btn btn-primary">
            Edit Resume
        </a>

        <button onclick="window.print()"
                class="btn btn-success">
            Print / Save PDF
        </button>

        <a href="/ats"
           class="btn btn-warning">
            ATS Check
        </a>

        <a href="/logout"
           class="btn btn-danger">
            Logout
        </a>

    </div>


    <!-- RESUME -->

    <div class="resume-paper">


        <!-- HEADER -->

        <div class="resume-header">

            <div id="previewName">
                Your Name
            </div>

            <div id="previewContact"></div>

            <div id="previewSocial"></div>

        </div>


        <!-- CAREER OBJECTIVE -->

        <div class="resume-section">

            <h2>
                Career Objective
            </h2>

            <p id="previewObjective">
                No career objective provided.
            </p>

        </div>


        <!-- EDUCATION -->

        <div class="resume-section">

            <h2>
                Education
            </h2>

            <div id="previewEducation"></div>

        </div>


        <!-- TECHNICAL SKILLS -->

        <div class="resume-section">

            <h2>
                Technical Skills
            </h2>

            <div id="previewSkills"></div>

        </div>


        <!-- PROJECTS -->

        <div class="resume-section">

            <h2>
                Projects
            </h2>

            <div id="previewProjects"></div>

        </div>


        <!-- CERTIFICATIONS -->

        <div class="resume-section">

            <h2>
                Certifications
            </h2>

            <ul id="previewCertifications"></ul>

        </div>


        <!-- INTERNSHIP / TRAINING -->

        <div class="resume-section">

            <h2>
                Internship / Training
            </h2>

            <div id="previewInternship"></div>

        </div>


        <!-- ACHIEVEMENTS -->

        <div class="resume-section">

            <h2>
                Achievements
            </h2>

            <ul id="previewAchievements"></ul>

        </div>


        <!-- LANGUAGES -->

        <div class="resume-section">

            <h2>
                Languages
            </h2>

            <ul id="previewLanguages"></ul>

        </div>


    </div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>


</body>

</html>
